services:
  app.dev:
    container_name: ncms_web_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.development.local
      - .env.db.local
      - .env.prisma.local
    ports:
      - 3000:3000
    depends_on:
      - db.dev
    volumes:
      - ./app:/app/app
      - ./public:/app/public
    profiles:
      - dev
  db.dev:
    container_name: ncms_db_dev
    image: postgres:15-alpine
    env_file:
      - .env.db.local
    ports:
      - 5432:5432
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    profiles:
      - dev
  ################################
  # Production
  ################################
  app.production:
    container_name: ncms_web_prod
    image: ghcr.io/starlightroad/ncms-prod
    build:
      context: .
      dockerfile: prod.Dockerfile
      args:
        - NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN=${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN}
    env_file:
      - .env.db.local
      - .env.production.local
      - .env.prisma.local
    ports:
      - 3002:3002
    expose:
      - 3002
    depends_on:
      - db.production
    profiles:
      - prod
  db.production:
    container_name: ncms_db_prod
    image: postgres:15-alpine
    env_file:
      - .env.db.local
    ports:
      - 5432:5432
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    profiles:
      - prod
volumes:
  db_data_dev:
  db_data_prod:
